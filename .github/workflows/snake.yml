name: Generate Snake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: SyedWaqarAliZaidi
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0f9d9a&color_dots=#f3ede6,#e0b184,#c58a52,#9a5f2e,#5a3318
            dist/github-contribution-grid-snake-dark.svg?color_snake=#4fd1c5&color_dots=#2b2520,#7a5c43,#b08968,#e0b184,#ffe3bf
      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
